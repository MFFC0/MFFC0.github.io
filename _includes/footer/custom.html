<!-- Email icon: also copy the address, since mailto does nothing without a mail app -->
<script>
  document.querySelectorAll(".author__email").forEach(function (link) {
    link.addEventListener("click", function () {
      var email = link.dataset.email;
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(email).then(function () {
        var toast = document.createElement("div");
        toast.className = "email-toast";
        toast.textContent = "Email copied: " + email;
        document.body.appendChild(toast);
        setTimeout(function () { toast.remove(); }, 2500);
      });
    });
  });
</script>
